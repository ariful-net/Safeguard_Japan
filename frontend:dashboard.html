<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Dashboard - SafeGuard Japan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <header class="border-b border-slate-800 bg-slate-950 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-chart-line text-red-500 mr-2"></i>Relief Coordination Dashboard</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Home</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl">
                <h3 class="text-sm font-semibold mb-4 text-slate-300">Relief Demands Overview</h3>
                <canvas id="reliefChart"></canvas>
            </div>
            <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl">
                <h3 class="text-sm font-semibold mb-4 text-slate-300">Recent Help Requests</h3>
                <div id="requestList" class="space-y-3 text-xs text-slate-300">
                    <!-- Requests dynamically inserted here -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
