<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Relief - SafeGuard Japan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-950 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-hand-holding-hand text-red-500 mr-2"></i>Emergency Relief Request</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Back to Home</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto my-8 p-6 bg-slate-950 border border-slate-800 rounded-2xl w-full">
        <form id="reliefForm" onsubmit="submitReliefRequest(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Full Name / Unique ID</label>
                <input type="text" id="reqName" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-red-500 focus:outline-none" placeholder="Ariful Islam">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Type of Assistance</label>
                <select id="reqType" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-red-500 focus:outline-none">
                    <option value="Food">Food & Clean Water</option>
                    <option value="Medical">Medical / First Aid</option>
                    <option value="Shelter">Shelter Support</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Location Details</label>
                <input type="text" id="reqLocation" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-red-500 focus:outline-none" placeholder="Osaka, Chuo Ward...">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                Submit Emergency Request
            </button>
        </form>
    </main>

    <script src="js/request.js"></script>
</body>
</html>
